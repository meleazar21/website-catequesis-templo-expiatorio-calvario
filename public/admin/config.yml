####################################################################################
#  Admin panel — Decap CMS
#
#  Defines what can be edited. Each "collection" below is a section of the panel.
#  Field `name`s are the JSON keys in content/; `label`s and `hint`s are what editors
#  see in the panel, so they stay in Spanish.
#
#  USED LOCALLY ONLY: `npm run admin` starts the proxy that writes to content/, and
#  `npm run dev` serves the panel at http://localhost:5173/admin/. It asks for no
#  password and doesn't touch GitHub: changes stay in the working tree and are pushed
#  with a commit. The build DELETES /admin, so the panel never reaches the published site.
#
#  The `backend` block below is NOT used in that mode (`local_backend` takes over), but
#  Decap requires it to exist. If the panel is ever wanted online, give it a real
#  backend and remove the `excludeAdminFromBuild` plugin from vite.config.ts:
#
#    - Git Gateway (Netlify) is DEPRECATED: it works on sites that already have it,
#      but Netlify no longer fixes its bugs, only serious security issues.
#    - Alternatives: DecapBridge (free, no proxy of your own, but a third party holds a
#      token with write access to the repository) or your own GitHub OAuth app.
####################################################################################

backend:
  name: git-gateway      # placeholder: locally, `local_backend` takes over
  branch: master

# Edit content ON THIS COMPUTER, without publishing anything and without logging in.
# If `npm run admin` isn't running, the panel tries to use the `backend` above and
# can't get in: that's the sign the proxy needs to be started.
local_backend: true

# Changes are saved as drafts and published with a button... except locally, where
# the proxy only supports direct saves and the CMS falls back to "simple" mode.
publish_mode: editorial_workflow

locale: es

# Where photos and videos uploaded from the panel end up.
media_folder: "public/fotos"
public_folder: "/fotos"

collections:
  # ------------------------------------------------------------------ Registration
  - name: inscripciones
    label: "Inscripciones"
    files:
      - name: inscripciones
        label: "Datos de inscripción"
        file: "content/inscripciones.json"
        description: "Lo más consultado del sitio. Recuerda cerrar las inscripciones cuando termine el periodo."
        fields:
          - { name: abiertas, label: "¿Inscripciones abiertas?", widget: boolean, default: true, hint: "Apagado muestra 'Inscripciones cerradas' y desactiva el botón." }
          - { name: inicio, label: "Fecha de inicio", widget: string }
          - { name: cierre, label: "Fecha de cierre", widget: string }
          - { name: horarioAtencion, label: "Horario de atención", widget: string }
          - { name: lugar, label: "Lugar", widget: string }
          - { name: enlace, label: "Enlace del botón INSCRIBIRME", widget: string, required: false, hint: "Google Forms, formulario propio o https://wa.me/505... Si se deja vacío, el botón lleva a la sección de contacto." }
          - { name: nota, label: "Nota al pie", widget: text }
          - name: requisitos
            label: "Requisitos"
            widget: list
            fields: [{ name: texto, label: "Requisito", widget: string }]

  # ------------------------------------------------------------------ Courses
  - name: cursos
    label: "Cursos de catequesis"
    label_singular: "Curso"
    folder: "content/cursos"
    extension: json
    format: json
    create: true
    identifier_field: nombre
    slug: "{{slug}}"
    summary: "{{orden}} · {{nombre}}"
    sortable_fields: [orden, nombre]
    fields:
      - { name: orden, label: "Orden en que aparece", widget: number, value_type: int, default: 1 }
      - { name: nombre, label: "Nombre del curso", widget: string }
      - { name: imagen, label: "Cartel del curso", widget: image, required: false, hint: "Opcional. El cartel que explica el curso; se ve entero (no se recorta) y al tocarlo se abre en grande para poder leerlo. Sin cartel, la tarjeta muestra el icono de siempre." }
      - { name: edad, label: "Edad", widget: string, hint: "Ej.: 7 – 10 años" }
      - { name: horario, label: "Horario", widget: string, hint: "Ej.: Sábados · 9:00 a. m." }
      - { name: duracion, label: "Duración", widget: string, hint: "Ej.: 2 años" }
      - { name: descripcion, label: "Descripción breve", widget: text }
      - name: detalle
        label: "Qué se vive en el curso"
        widget: list
        fields: [{ name: texto, label: "Punto", widget: string }]

  # ------------------------------------------------------------------ Schedules
  - name: horarios
    label: "Horarios"
    files:
      - name: horarios
        label: "Tabla de horarios"
        file: "content/horarios.json"
        fields:
          - name: items
            label: "Horarios"
            widget: list
            summary: "{{curso}} · {{dia}} {{hora}}"
            fields:
              - { name: curso, label: "Curso", widget: string }
              - { name: dia, label: "Día", widget: string }
              - { name: hora, label: "Hora", widget: string }
              - { name: lugar, label: "Lugar", widget: string }

  # ------------------------------------------------------------------ Announcements
  - name: avisos
    label: "Avisos"
    label_singular: "Aviso"
    folder: "content/avisos"
    extension: json
    format: json
    create: true
    identifier_field: titulo
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "{{orden}} · {{titulo}}"
    sortable_fields: [orden, titulo]
    fields:
      - { name: orden, label: "Orden en que aparece", widget: number, value_type: int, default: 1 }
      - { name: titulo, label: "Título", widget: string }
      - { name: categoria, label: "Categoría", widget: select, options: [INSCRIPCIONES, SACRAMENTOS, REUNIONES, ACTIVIDADES, AVISOS] }
      - { name: fecha, label: "Fecha", widget: string }
      - { name: descripcion, label: "Descripción", widget: text }
      - { name: destacado, label: "Destacar", widget: boolean, default: false, hint: "Lo resalta con borde dorado." }

  # ------------------------------------------------------------------ Events
  - name: eventos
    label: "Próximas actividades"
    label_singular: "Actividad"
    folder: "content/eventos"
    extension: json
    format: json
    create: true
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{dia}} {{mes}} · {{titulo}}"
    sortable_fields: [orden, titulo]
    fields:
      - { name: orden, label: "Orden en que aparece", widget: number, value_type: int, default: 1 }
      - { name: dia, label: "Día", widget: string, hint: "Solo el número. Ej.: 28" }
      - { name: mes, label: "Mes", widget: string, hint: "Ej.: Marzo" }
      - { name: titulo, label: "Título", widget: string }
      - { name: hora, label: "Hora", widget: string }
      - { name: lugar, label: "Lugar", widget: string }

  # ------------------------------------------------------------------ Catechists
  - name: catequistas
    label: "Catequistas"
    label_singular: "Catequista"
    folder: "content/catequistas"
    extension: json
    format: json
    create: true
    identifier_field: nombre
    slug: "{{slug}}"
    summary: "{{orden}} · {{nombre}}"
    sortable_fields: [orden, nombre]
    fields:
      - { name: orden, label: "Orden en que aparece", widget: number, value_type: int, default: 1 }
      - { name: nombre, label: "Nombre", widget: string }
      - { name: grupo, label: "Curso o grupo", widget: string, hint: "Ej.: Catequista de Primera Comunión" }
      - { name: frase, label: "Frase", widget: text }
      - { name: foto, label: "Fotografía", widget: image, required: false, hint: "Si se deja vacío se muestra un marcador." }
      - name: encuadre
        label: "Encuadre de la foto en la tarjeta"
        widget: select
        required: false
        default: normal
        options:
          - { label: "Normal (cara y logo de la camisa)", value: normal }
          - { label: "Más arriba (si se corta la cabeza)", value: arriba }
          - { label: "Centro", value: centro }
          - { label: "Más abajo", value: abajo }
        hint: "Solo cambia algo si la foto es más alta que la tarjeta. En 'Ver perfil' la foto siempre se ve completa."

  # ------------------------------------------------------------------ Gallery
  - name: galeria
    label: "Galería"
    label_singular: "Fotografía"
    folder: "content/galeria"
    extension: json
    format: json
    create: true
    identifier_field: titulo
    slug: "{{slug}}"
    summary: "{{orden}} · {{titulo}}"
    sortable_fields: [orden, titulo]
    fields:
      - { name: orden, label: "Orden en que aparece", widget: number, value_type: int, default: 1 }
      - { name: titulo, label: "Título", widget: string }
      - { name: foto, label: "Fotografía", widget: image, required: false }
      - { name: alto, label: "Tamaño en el mosaico", widget: select, options: [corto, medio, alto], default: medio }

  # ------------------------------------------------------------------ Site
  - name: sitio
    label: "Configuración del sitio"
    files:
      - name: general
        label: "Portada, textos y contacto"
        file: "content/site.json"
        fields:
          - { name: marca, label: "Nombre completo", widget: string }
          - { name: marcaLinea1, label: "Nombre — primera línea del logotipo", widget: string }
          - { name: marcaLinea2, label: "Nombre — segunda línea del logotipo", widget: string }
          - { name: parroquia, label: "Parroquia", widget: string }
          - { name: parroquiaLinea2, label: "Parroquia — segunda línea", widget: string }
          - { name: ciudad, label: "Ciudad", widget: string }
          - { name: lema, label: "Lema", widget: string }
          - { name: versiculoTexto, label: "Versículo de la portada", widget: string }
          - { name: versiculoCita, label: "Cita del versículo", widget: string }

          # Hero background: a photo, a video, both, or neither can be set.
          # With nothing set, a blue gradient is shown, which also looks good.
          - { name: portadaFoto, label: "Portada — fotografía de fondo", widget: image, required: false, hint: "Opcional. Con esto basta para tener una portada con imagen. Apaisada y de buena resolución; comprímela a menos de 400 KB." }
          - { name: portadaFotoMovil, label: "Portada — fotografía para el teléfono", widget: image, required: false, hint: "Opcional pero MUY recomendable: una foto apaisada, en la pantalla vertical de un teléfono, se recorta por los lados y solo se ve un tercio. Sube aquí una vertical (9:16) o un recorte vertical de la misma escena. Si se deja vacío se usa la de arriba." }
          # The `pattern` is there so a photo doesn't end up in this field: it happened,
          # and the browser tries to play a JPG as a video, so the hero stays black
          # without saying why.
          - name: portadaVideo
            label: "Portada — video de fondo (opcional)"
            widget: file
            required: false
            hint: "Solo si quieres que la portada se mueva. MP4 SIN AUDIO, en bucle y de MENOS DE 5 MB. Si es HORIZONTAL llena toda la portada; si es vertical (grabado con el teléfono parado) se muestra completo a la derecha del texto. En teléfonos no se reproduce: ahí se ve la fotografía de arriba, así que conviene subir las dos."
            # SINGLE quotes: in YAML, "\." inside double quotes is an invalid escape and
            # breaks the whole file, so the panel stops loading.
            pattern: ['\.(mp4|webm)$|^$', 'Aquí solo va un video .mp4 o .webm. Si es una fotografía, va en el campo de arriba.']

          - { name: bienvenidaTitulo, label: "Bienvenida — título", widget: string }
          - { name: bienvenidaTexto, label: "Bienvenida — texto", widget: text, hint: "Deja una línea en blanco entre párrafos." }
          - { name: bienvenidaFoto, label: "Bienvenida — fotografía", widget: image, required: false }
          # Same `pattern` guard as portadaVideo: keeps a photo out of the video field.
          - name: bienvenidaVideo
            label: "Bienvenida — video (opcional)"
            widget: file
            required: false
            hint: "Si subes un video, se muestra EN LUGAR de la fotografía, y la fotografía queda como portada del video hasta que le den reproducir. MP4, idealmente de menos de 20 MB. Para volver a la fotografía, borra este campo."
            pattern: ['\.(mp4|webm)$|^$', 'Aquí solo va un video .mp4 o .webm. Si es una fotografía, va en el campo de arriba.']

          - { name: papaTitulo, label: "Mensaje del Papa — título", widget: string }
          - { name: papaTexto, label: "Mensaje del Papa — texto", widget: text, hint: "Deja una línea en blanco entre párrafos." }
          - { name: papaVideo, label: "Mensaje del Papa — enlace de YouTube", widget: string, required: false, hint: "Pega el enlace del video tal como lo copias de YouTube (botón Compartir). Si se deja vacío, la sección no aparece." }

          - { name: misionTitulo, label: "Misión — título", widget: string }
          - { name: misionTexto, label: "Misión — texto", widget: text }
          - { name: visionTitulo, label: "Visión — título", widget: string }
          - { name: visionTexto, label: "Visión — texto", widget: text }

          - { name: telefono, label: "Teléfono", widget: string }
          - { name: whatsapp, label: "WhatsApp", widget: string, required: false, hint: "Solo dígitos con código de país. Ej.: 50588887777" }
          - { name: correo, label: "Correo electrónico", widget: string }
          - { name: direccion, label: "Dirección", widget: string }
          - { name: horarioAtencion, label: "Horario de atención", widget: string }
          # Accepts the browser's long URL, coordinates or an address; the site
          # translates them. The only thing that does NOT work is the short "Share"
          # link (maps.app.goo.gl): only Google knows where it points, so it can't be embedded.
          - { name: mapaEmbedUrl, label: "Mapa — ubicación del templo", widget: string, required: false, hint: "Busca el templo en Google Maps y copia la dirección de la barra del navegador (la larga, que empieza por https://www.google.com/maps/place/...). NO uses el enlace corto del botón Compartir. Vacío = no se muestra el mapa." }
          - { name: facebook, label: "Facebook", widget: string, required: false }
          - { name: instagram, label: "Instagram", widget: string, required: false }
          - { name: youtube, label: "YouTube", widget: string, required: false, hint: "Opcional. Si se deja vacío no aparece." }
          - { name: tiktok, label: "TikTok", widget: string, required: false, hint: "Opcional. Si se deja vacío no aparece." }
